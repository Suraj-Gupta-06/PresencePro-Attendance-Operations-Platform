<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PresencePro</title>
  <meta name="description" content="Sign in to PresencePro attendance operations">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="icon" href="/static/assets/branding/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/branding/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/branding/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/branding/apple-touch-icon.png">
  <link rel="manifest" href="/static/assets/branding/site.webmanifest">
</head>
<body>
<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon brand-logo" aria-hidden="true">
        <img src="/static/assets/branding/apple-touch-icon.png" alt="" />
      </div>
      <h1>PresencePro</h1>
      <p>Attendance Operations Platform</p>
    </div>

    <div id="alert-area"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" class="form-control" placeholder="admin@admin.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
        <span id="btn-text">Sign In</span>
        <span id="btn-spinner" class="spinner" style="display:none"></span>
      </button>
    </form>

    <div class="auth-footer"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script>
  // Redirect if already logged in
  if (localStorage.getItem('access_token')) {
    window.location.href = '/dashboard';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btnText  = document.getElementById('btn-text');
    const spinner  = document.getElementById('btn-spinner');
    const btn      = document.getElementById('login-btn');
    const alertArea = document.getElementById('alert-area');

    btn.disabled = true;
    btnText.textContent = 'Signing in…';
    spinner.style.display = 'inline-block';
    alertArea.innerHTML = '';

    try {
      const res = await API.post('/api/v1/auth/login', { email, password });
      if (res.success) {
        localStorage.setItem('access_token', res.data.access_token);
        localStorage.setItem('refresh_token', res.data.refresh_token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        showToast('Welcome back!', 'success');
        setTimeout(() => window.location.href = '/dashboard', 500);
      } else {
        alertArea.innerHTML = `<div class="alert alert-error"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3a2 2 0 0 1 3.4 0l7 12A2 2 0 0 1 19 19H5a2 2 0 0 1-1.7-2.7z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg> ${res.message}</div>`;
      }
    } catch(err) {
      alertArea.innerHTML = `<div class="alert alert-error"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3a2 2 0 0 1 3.4 0l7 12A2 2 0 0 1 19 19H5a2 2 0 0 1-1.7-2.7z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg> ${err.message || 'Login failed. Please try again.'}</div>`;
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Sign In';
      spinner.style.display = 'none';
    }
  }
</script>
</body>
</html>
