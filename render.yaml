services:
  - type: web
    name: presencepro
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ADMIN_EMAIL
        value: admin@admin.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: DATABASE_URL
        fromDatabase:
          name: presencepro-db
          property: connectionString

databases:
  - name: presencepro-db
    plan: free
    databaseName: attendance_db
    user: attendance_user
